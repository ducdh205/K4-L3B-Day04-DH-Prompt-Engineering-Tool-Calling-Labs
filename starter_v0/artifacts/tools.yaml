tools:
  # ---------------- Core E-Commerce Customer Support Tools ----------------
  - name: clarify
    description: "Hoi lai nguoi dung khi thieu thong tin bat buoc (Ma don hang, email, xac nhan)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Cau hoi danh cho khach hang"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kieu tra loi"}
        options: {type: array, default: [], items: {type: string}, description: "Cac lua chon neu co"}
      required: [question]

  - name: search_store_policy
    description: "Tra cuu quy dinh, chinh sach giao hang, phi ship va quy dinh chung cua cua hang."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Noi dung chinh sach can tim"}
        category: {type: string, enum: [all, returns, refunds, shipping, vouchers, general], default: "all", description: "Nhom chinh sach"}
        top_k: {type: integer, default: 3, description: "So ket qua tra ve"}
      required: [query]

  - name: check_order_status
    description: "Kiem tra trang thai don hang, don vi van chuyen va ngay giao hang du kien qua ma don hang."
    parameters:
      type: object
      properties:
        order_id: {type: string, description: "Ma don hang (vi du: ORD-8801)"}
      required: [order_id]

  - name: inspect_product_warranty
    description: "Tra cuu thoi han bao hanh, ma serial va ket qua chan doan tinh trang bao hanh san pham."
    parameters:
      type: object
      properties:
        serial_number: {type: string, description: "Ma serial number cua san pham"}
        check: {type: string, enum: [all, hardware, bluetooth, battery, display], default: "all", description: "Nhom kiem tra"}
      required: [serial_number]

  - name: lookup_customer
    description: "Tra cuu thong tin khach hang, hang VIP, email, dia chi qua Ma khach hang hoac Email."
    parameters:
      type: object
      properties:
        customer_id: {type: string, description: "Ma khach hang (vi du: CUST-1001)"}
        email: {type: string, description: "Email khach hang"}

  - name: format_return_summary
    description: "Format va xuat bao cao tong hop khieu nai / yeu cau doi tra."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Cac ket qua da thu thap"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mau bao cao"}
        incident_title: {type: string, default: "Customer Return Summary", description: "Tieu de bao cao"}
      required: [findings, template]

  - name: search_product_specs
    description: "Tim kiem thong so ky thuat cong khai, huong dan su dung cua san pham tren internet."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hang san xuat, vi du: Sony, Logitech"}
        model: {type: string, description: "Ten model san pham, vi du: WH-1000XM5"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "specs", description: "Loai thong tin"}
        max_results: {type: integer, default: 3, description: "So ket qua"}
      required: [manufacturer, model, query_type]

  - name: check_refund_conditions
    description: "Kiem tra dieu kien hoan tien, thoi han hoan tien cho tung loai san pham."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Noi dung kiem tra hoan tien"}
        policy_area: {type: string, enum: [all, returns, refunds, vouchers], default: "all", description: "Linh vuc kiem tra"}
        top_k: {type: integer, default: 3, description: "So ket qua"}
      required: [query]

  - name: create_return_ticket
    description: "Tao ticket yeu cau doi tra hang. BAT BUOC confirm tu nguoi dung (confirmed: true) truoc khi goi."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tom tat ly do doi tra"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Muc uu tien"}
        order_id: {type: string, default: "", description: "Ma don hang"}
        confirmed: {type: boolean, default: false, description: "Xac nhan tu khach hang (true neu dong y, false neu chua)"}
      required: [summary]

  # ---------------- Bonus Tool (+10 Points) ----------------
  - name: auto_generate_compensation_voucher
    description: "Tu dong phat hanh Voucher den bu tri gia 50k-200k/20$ cho don hang bi giao tre hoac loi nho. Can xac nhan (confirmed: true)."
    parameters:
      type: object
      properties:
        order_id: {type: string, description: "Ma don hang duoc den bu"}
        reason: {type: string, description: "Ly do den bu (shipping_delay, packaging_damage)"}
        amount_usd: {type: number, default: 20.0, description: "So tien den bu USD"}
        confirmed: {type: boolean, default: false, description: "Xac nhan tu khach hang (true/false)"}
      required: [order_id, reason]
